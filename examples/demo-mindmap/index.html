<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>Mindmap Demo</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: oklch(98.5% 0.002 247.839);
    }

    #test {
      display: block;
      position: absolute;
      line-height: 1.4;
      padding: 6px 12px;
      font-size: 16px;
      /* width: max-content; */
      /* max-width: 200px; */
      background-color: rgba(255, 0, 255, 0.1);
      color: rgba(255, 0, 0, 0.5);
      border-radius: 0px;
      top: 400px;
    }

    #text2 {
      font-family: sans-serif;
      position: absolute;
      padding: 6px 12px;
      font-size: 100px;
      width: max-content;
      /* max-width: 200px; */
      background-color: rgba(255, 0, 255, 0.1);
      color: rgba(255, 0, 0, 0.5);
      border-radius: 6px;
      left: 200px;
      top: 0px;
      line-height: 1.4;
      resize: none;
      overflow: hidden;
      outline: none;
      height: 600px;
    }
  </style>
</head>

<body>

</html>
