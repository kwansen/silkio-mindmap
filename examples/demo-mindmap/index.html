<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>Mindmap Demo</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: white;
    }

    #test {
      display: block;
      position: absolute;
      line-height: 1.4;
      padding: 6px 12px;
      font-size: 16px;
      /* width: max-content; */
      /* max-width: 200px; */
      background-color: rgba(255, 0, 255, 0.1);
      color: rgba(255, 0, 0, 0.5);
      border-radius: 0px;
      top: 400px;
    }

    #text2 {
      font-family: sans-serif;
      position: absolute;
      padding: 6px 12px;
      font-size: 100px;
      width: max-content;
      /* max-width: 200px; */
      background-color: rgba(255, 0, 255, 0.1);
      color: rgba(255, 0, 0, 0.5);
      border-radius: 6px;
      left: 200px;
      top: 0px;
      line-height: 1.4;
      resize: none;
      overflow: hidden;
      outline: none;
      height: 600px;
    }
    #toolbar {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    #toolbar button,
    #toolbar select {
      padding: 6px 14px;
      font-size: 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background-color: #ffffff;
      color: #1f2937;
      cursor: pointer;
    }

    #toolbar button:disabled {
      color: #9ca3af;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <!-- <div id="test">分支二</div> -->
  <!-- <textarea name="" id="text2"></textarea> -->
  <canvas id="canvas"></canvas>
  <div id="toolbar">
    <select id="direction-select">
      <option value="right">横向思维导图</option>
      <option value="left">左向思维导图</option>
      <option value="down">组织结构图</option>
    </select>
    <button id="undo-btn" disabled>撤销</button>
    <button id="redo-btn" disabled>重做</button>
    <button id="export-btn">导出图片</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
